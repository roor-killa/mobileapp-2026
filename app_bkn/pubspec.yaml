name: app_bkn
description: BKN - Paiement étudiant nouvelle génération
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI/Icons
  cupertino_icons: ^1.0.8
  
  # HTTP & Networking
  http: ^1.2.1
  url_launcher: ^6.2.4
  
  # State Management
  provider: ^6.1.2
  
  # Design & Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  
  # Utilitaires
  intl: ^0.18.0
  shared_preferences: ^2.2.2
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0  # Version récente mais stable

flutter:
  uses-material-design: true