version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bkn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bkn_db
      POSTGRES_USER: bkn_admin
      POSTGRES_PASSWORD: BknSecurePass2026!
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - bkn_postgres_data:/var/lib/postgresql/data
    networks:
      - bkn_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkn_admin -d bkn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: bkn_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - bkn_network
    depends_on:
      - postgres

  api:
    build: .
    container_name: bkn_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bkn_db
      DB_USER: bkn_admin
      DB_PASSWORD: BknSecurePass2026!
    volumes:
      - ./server.py:/app/server.py
    networks:
      - bkn_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bkn_postgres_data:
    name: bkn_postgres_data

networks:
  bkn_network:
    name: bkn_network
    driver: bridge