services:
  # ─── Application Laravel (PHP-FPM) ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payflow_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    env_file:
      - .env
    networks:
      - payflow_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Nginx Web Server ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: payflow_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - payflow_network
    depends_on:
      - app

  # ─── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: payflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-payflow}
      POSTGRES_USER: ${DB_USERNAME:-payflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-payflow_user} -d ${DB_DATABASE:-payflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payflow_network

  # ─── Redis (Sessions, Cache, Queue) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: payflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payflow_network

  # ─── Ollama (Chatbot IA local) ────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: payflow_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - payflow_network
    # Décommenter si vous avez un GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─── PgAdmin (Interface graphique PostgreSQL) ──────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: payflow_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "5050:80"
    networks:
      - payflow_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  ollama_data:

networks:
  payflow_network:
    driver: bridge
