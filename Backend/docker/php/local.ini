[PHP]
; ─── Performances ─────────────────────────────────────────────────────────────
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; ─── Upload ───────────────────────────────────────────────────────────────────
upload_max_filesize = 20M
post_max_size = 20M
max_file_uploads = 20

; ─── Timezone ─────────────────────────────────────────────────────────────────
date.timezone = "Europe/Paris"

; ─── Errors (désactiver en production) ───────────────────────────────────────
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; ─── Sessions ─────────────────────────────────────────────────────────────────
session.gc_maxlifetime = 14400
