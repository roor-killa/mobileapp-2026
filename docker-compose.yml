services:
  mysql:
    image: mysql:8.4
    container_name: mobileapp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mobileapp_db
      MYSQL_USER: mobileapp_user
      MYSQL_PASSWORD: mobileapp_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: